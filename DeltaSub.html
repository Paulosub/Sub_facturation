/* ── Formules d'entité (§2.3) : calculs purs sur des doubles, arrondi rJ à l'affichage seulement ── */
const plContrat=pm=>plN(pm.CONTRACTAMOUNT)+plN(pm.CONTRACTAMOUNTADDITION);                                   // getContractAmountTotal
const plDeductions=pm=>PL_DED.reduce((a,f)=>a+plN(pm[f]),0);                                                     // getDeductionTotal
const plFraisInternes=pm=>{ const b=plContrat(pm)-plDeductions(pm); return b!==0?b*plN(pm.INTERNALCOSTFACTOR)/100:0; };   // getInternalCost@10-28
const plBudget=pm=>plContrat(pm)-plDeductions(pm)-plFraisInternes(pm);                                           // getAmountTotal « Budget d'honoraires »
const plAttendu=pm=>plN(pm.SCHEDULEDAMOUNT)+plN(pm.SUBPLANNERAMOUNT)+plN(pm.SUBCONTRACTORAMOUNT)+plN(pm.AMENDEDAMOUNT);   // getExpectedAmount
const plTimeHourCalc=pm=>plN(pm.EXTERNALRATE)>0?plBudget(pm)/plN(pm.EXTERNALRATE):0;                              // budget temps recalculé (updatePlanningMonths@45-81)
const plHeures=(pt,pm)=>{ pm=pm||plPmOf(pt); return pm?plN(pm.TIMEHOUR)*plN(pt.TIMERATE)/100:0; };               // PlanningTime.getTimeHour (jamais stocké)
const plMontantInterne=(pt,pm)=>plHeures(pt,pm)*plN(pt.INTERNALRATE);                                            // getInternalAmount « Coût de revient »
const plTotalTimeRate=pm=>plTimes(pm).reduce((a,pt)=>a+plN(pt.TIMERATE),0);
const plTotalInterne=pm=>plTimes(pm).reduce((a,pt)=>a+plMontantInterne(pt,pm),0);                              // getTotalInternalAmount (sans facteur, §0.2 n° 1)
const plIsAssigned=pm=>plTimes(pm).some(pt=>DS.by('planningassignment','PLANNINGTIME_ID',pt.ID).length>0);       // isPlanningAssignedToStaff
/* heures des sous-catégories d'une catégorie pour ce mois (getTotalPlanningStaffTimeHour) ; sans catégorie : toutes */
const plStaffHours=(pm,role)=>{ const r=plId(role); return plStaffTimes(pm).reduce((a,x)=>{ const s=DS.get('planningstaff',x.PLANNINGSTAFF_ID); return s&&(r==null||s.PLANNINGROLE_ID===r)?a+plN(x.TIMEHOUR):a; },0); };
const plStaffCost=(pm,role)=>{ const r=plId(role); return plStaffTimes(pm).reduce((a,x)=>{ const s=DS.get('planningstaff',x.PLANNINGSTAFF_ID); return s&&(r==null||s.PLANNINGROLE_ID===r)?a+plN(x.TIMEHOUR)*plN(s.STAFFRATE):a; },0); };   // coût de revient replanifié (§3.10)
const plSuggestedRate=(pm,role)=>{ const th=plN(pm.TIMEHOUR); return th<=0?null:100*plStaffHours(pm,role)/th; };   // null si budget temps ≤ 0 → mois ignoré
/* facteur des frais internes au mois (y, m) : dernier planningcostfactor valable (12·VY+VM ≤ 12·y+m), sinon 0 */
const plFacteur=(y,m)=>{ let f=0; for(const c of plCostFactors()){ if(12*plN(c.VALIDFROMYEAR)+plN(c.VALIDFROMMONTH)<=12*y+m) f=plN(c.INTERNALCOSTFACTOR); else break; } return f; };
const plAssHeures=pt=>plAssigns(pt).reduce((a,x)=>a+plN(x.TIMEPERIOD),0);
const sptAttribue=spt=>spt?DS.by('planningassignment','STAFFPROJECTTIME_ID',spt.ID).reduce((a,x)=>a+plN(x.TIMEPERIOD),0):0;   // getTotalAssignedTime
const sptDisponible=spt=>spt?dpCalc(dpTarget(spt.STAFF_ID,spt.TIMEYEAR,spt.TIMEMONTH),spt):0;                       // getAvailableTime (heures prévues − 6 déductions)
const tlCout=t=>tlCost(t);                                                                                      // TimeLog.getStaffAmount (0 sans tarif)
const tlCoutFI=t=>tlCout(t)*(1+plFacteur(t.TIMEYEAR,t.TIMEMONTH)/100);                                          // « Coût de revient (+) frais internes »
/* ligne du dialogue « Attribuer les collaborateurs » (§3.9) pour une part, un spt (ou null) et son attribution (ou null) ;
   part = Math.round(100 / budget de la part × attribuées) dans cet ordre (PlanningAssignmentTableModel$Row.getPlannedTimeRate) ; budget 0 → vide (l'original afficherait −1) */
function plAssStat(pt,spt,a){ const hh=plHeures(pt), cur=a?plN(a.TIMEPERIOD):0, tot=sptAttribue(spt), bud=spt?plN(spt.TIMEBUDGET):null;
  return {budget:bud,deja:spt?tot-cur:null,dispo:spt?bud-(tot-cur):null,attr:a?cur:null,part:a&&hh?Math.round(100/hh*cur):null,apres:spt?bud-tot:null}; }
/* chaîne attribution → part → catégorie → planification → affaire : PROJECT_ID ou null */
function plAssProject(a){ const pt=DS.get('planningtime',a&&a.PLANNINGTIME_ID)||{}, pr=DS.get('planningrole',pt.PLANNINGROLE_ID)||{}, ps=DS.get('planningsubproject',pr.PLANNINGSUBPROJECT_ID)||{}; return ps.PROJECT_ID??null; }

/* ── Taux de réalisation pondéré (§2.4, SubPhaseReport) ──
   plSubPhaseMap(affaire, ouvrages, phases) → {phases: Map(SUBPHASE_ID|null → {total, rates: Map(clé → taux)}), kmax, total}
   Taux de chaque mois retenu (0 compris, dernier gagnant) ; de la 1re clé de la phase à kmax (max de tous les mois retenus), report du dernier taux connu. */
function plSubPhaseMap(p,subs,phases){ const M=new Map(); let kmax=0, total=0;
  plMonths(p,subs,phases).forEach(pm=>{ const ph=pm.SUBPHASE_ID??null, b=plBudget(pm), k=plKey(pm); let R=M.get(ph); if(!R) M.set(ph,R={total:0,rates:new Map()});
    R.total+=b; total+=b; R.rates.set(k,plN(pm.IMPLEMENTATIONRATE)); if(k>kmax) kmax=k; });
  M.forEach(R=>{ const k0=Math.min(...R.rates.keys()); let last=0; for(let k=k0;k<=kmax;k++){ if(R.rates.has(k)) last=R.rates.get(k); else R.rates.set(k,last); } });
  return {phases:M,kmax,total}; }
/* taux propre d'une phase au mois (y, m) : clé plafonnée à kmax ; 0 avant le premier mois planifié */
const plTauxPhase=(S,ph,y,m)=>{ const R=S.phases.get(plId(ph)); if(!R) return 0; const k=Math.min(12*y+m,S.kmax); return R.rates.has(k)?R.rates.get(k):0; };
/* Σ taux_phase × budget_phase / budgetTotal ; 0 si budgetTotal = 0 (l'original affiche NaN, §5.10 n° 7).
   pos = true : garde de Management ▸ Marge bénéficiaire (τ calculé seulement si budgetTotal > 0) */
function plTauxPondere(S,y,m,pos){ if(!S||(pos?!(S.total>0):S.total===0)) return 0; let t=0; S.phases.forEach((R,ph)=>{ t+=plTauxPhase(S,ph,y,m)*R.total/S.total; }); return t; }
const plPrestations=(S,y,m)=>S?S.total*plTauxPondere(S,y,m)/100:0;   // prestations estimées = budgetTotal (tous mois) × τ / 100

/* barres empilées multi-catégories (StackedBarChart JavaFX) : [{x:'Budget d'honoraires janv. 2026', parts:[[série, valeur],…]},…] → {xs, series} pour mgChart */
function plStackData(cats){ const names=[], seen=new Set(); cats.forEach(c=>(c.parts||[]).forEach(([n])=>{ if(!seen.has(n)){ seen.add(n); names.push(n); } }));
  return {xs:cats.map(c=>c.x),series:names.map(n=>({name:n,vals:cats.map(c=>{ const q=(c.parts||[]).find(x=>x[0]===n); return q?q[1]:null; })}))}; }

/* ── Droits (§1.2) : APPUSER → APPCOMPANYROLE → APPROLE.RIGHTS « module,droit; » (db.user.Rights) ──
   Security.hasRight = droit présent ou superadmin (0,0). Le bureau n'a jamais eu la licence DELTAplanning : à défaut du droit propre,
   le droit « management » (8,0) suffit. Sans rôles repris (approle vide) : tout est permis, comme le reste de DeltaSub. */
const PL_RIGHTS={superadmin:'0,0',management:'8,0',managementPlanning:'8,3',projectPlanning:'4,24',projectPlanningAnalyze:'4,25'};
function plRights(u){ if(u===undefined) u=ME.u; const s=new Set(); if(!u) return s;
  DS.by('appuser_appcompanyrole','APPUSER_ID',u.ID).forEach(l=>DS.by('appcompanyrole_approle','APPCOMPANYROLE_ID',l.APPCOMPANYROLES_ID).forEach(k=>
    String((DS.get('approle',k.APPROLES_ID)||{}).RIGHTS||'').split(';').forEach(x=>{ const q=x.split(','); if(q.length>1&&q[0]!==''&&q[1]!=='') s.add((+q[0])+','+(+q[1])); })));
  return s; }
function plCan(r,u){ if(!DS.all('approle').length) return true; const s=plRights(u), has=c=>!!c&&(s.has(c)||s.has(PL_RIGHTS.superadmin));
  return has(PL_RIGHTS[r]||r)||has(PL_RIGHTS.management); }

/* ── Dialogues communs (JOptionPane) : bouton par défaut focalisé → Entrée = OK / Oui, Échap = fermer / Non ── */
const plFocusPri=D=>{ const b=D.bd.parentNode.querySelector('.ft .btn.pri'); if(b) b.focus(); return b; };
const plInfo=(msg,title)=>new Promise(res=>{ const D=dialog({title:title||'Information',body:h('div',{style:{whiteSpace:'pre-line',maxWidth:'460px'}},msg),buttons:[{t:'OK',pri:true,fn:()=>res(true)}]});
  D.bd.closest('.ov').addEventListener('keydown',e=>{ if(e.key==='Escape') res(true); }); plFocusPri(D); });
const plAsk=(msg,title)=>new Promise(res=>{ const D=dialog({title:title||'Avertissement',body:h('div',{style:{whiteSpace:'pre-line',maxWidth:'460px'}},msg),buttons:[{t:'Non',fn:()=>res(false)},{t:'Oui',pri:true,fn:()=>res(true)}]});
  D.bd.closest('.ov').addEventListener('keydown',e=>{ if(e.key==='Escape') res(false); }); plFocusPri(D); });
/* ConfirmationCheckedDialog.isConfirmed(fenêtre, titre, bouton, message, case) : bouton actif seulement case cochée ; largeur min. 540, texte 400 px */
function plConfirmChecked(title,ok,msg,chk){ return new Promise(res=>{ let done=false; const fin=v=>{ if(!done){ done=true; res(v); } }, cb=h('input',{type:'checkbox'});
  const D=dialog({title:title||'Confirmation',width:'540px',body:h('div',{},h('p',{style:{width:'400px',margin:'0 0 14px',whiteSpace:'pre-line'}},msg),h('label',{style:{display:'flex',gap:'6px',alignItems:'center'}},cb,chk)),
    buttons:[{t:'Annuler',fn:()=>fin(false)},{t:ok||'OK',pri:true,fn:()=>{ if(!cb.checked) return false; fin(true); }}]});
  const b=plFocusPri(D); b.disabled=true; cb.focus(); cb.onchange=()=>{ b.disabled=!cb.checked; };
  D.bd.closest('.ov').addEventListener('keydown',e=>{ if(e.key==='Escape') fin(false); }); }); }

/* ── Intégrité (§2.2) : plDeleteOps*(enregistrement) → {ops, msg} ; msg = refus (Information), sinon ops à committer d'un seul bloc ── */
function plOps(){ const ops=[], seen=new Set(); return {ops,del:(t,r)=>{ if(!r||r.ID==null) return; const k=t+'|'+r.ID; if(seen.has(k)) return; seen.add(k); ops.push({t,id:r.ID,val:null}); }}; }
const plCascTime=(O,pt)=>{ O.del('planningtime',pt); plAssigns(pt).forEach(a=>O.del('planningassignment',a)); };                              // part → attributions
const plCascStaff=(O,st)=>{ O.del('planningstaff',st); DS.by('planningstafftime','PLANNINGSTAFF_ID',st.ID).forEach(x=>O.del('planningstafftime',x)); };   // sous-catégorie → heures
const plCascRole=(O,r)=>{ O.del('planningrole',r); DS.by('planningtime','PLANNINGROLE_ID',r.ID).forEach(pt=>plCascTime(O,pt)); DS.by('planningstaff','PLANNINGROLE_ID',r.ID).forEach(st=>plCascStaff(O,st)); };
const plCascMonth=(O,pm)=>{ O.del('planningmonth',pm); plTimes(pm).forEach(pt=>plCascTime(O,pt)); plStaffTimes(pm).forEach(x=>O.del('planningstafftime',x)); };
const plCascSubProject=(O,ps)=>{ O.del('planningsubproject',ps); DS.by('planningrole','PLANNINGSUBPROJECT_ID',ps.ID).forEach(r=>plCascRole(O,r)); };
/* affaire (delProject) : PAS de cascade — Integrity.isProjectDeletable refuse l'affaire dès qu'une planification par ouvrage ou un mois existe
   (getPlanningSubProjectCount / getPlanningMonthCount), avec le message habituel « Des documents, des heures ou des frais… » */
const plProjectUsed=p=>{ const pid=plId(p); return DS.by('planningsubproject','PROJECT_ID',pid).length>0||DS.by('planningmonth','PROJECT_ID',pid).length>0; };
/* planification par ouvrage : seulement sans catégorie ni mois (editPlanningSubProject@1-24, isPlanningMonthListEmpty) */
const plCanDeleteSubProject=ps=>!!ps&&!plRoles(ps).length&&!DS.by('planningmonth','PROJECT_ID',ps.PROJECT_ID).some(pm=>(pm.SUBPROJECT_ID??null)===(ps.SUBPROJECT_ID??null));
function plDeleteOpsSubProject(ps){ if(!plCanDeleteSubProject(ps)) return {ops:[],msg:PL_MSG.used}; const O=plOps(); plCascSubProject(O,ps); return {ops:O.ops,msg:null}; }
function plDeleteOpsRole(r){ if(DS.by('planningtime','PLANNINGROLE_ID',r.ID).length||DS.by('planningstaff','PLANNINGROLE_ID',r.ID).length) return {ops:[],msg:PL_MSG.used};
  return {ops:[{t:'planningrole',id:r.ID,val:null}],msg:null}; }
/* mois : refus dans l'ordre de deletePlanningMonth (paiement, attributions, planification des ressources), sinon cascade des parts */
function plDeleteOpsMonth(pm){ const msg=plN(pm.SETTLEDAMOUNT)>0?PL_MSG.monthSettled:plIsAssigned(pm)?PL_MSG.monthAssigned:plStaffTimes(pm).length?PL_MSG.monthStaffTime:null;
  if(msg) return {ops:[],msg}; const O=plOps(); plCascMonth(O,pm); return {ops:O.ops,msg:null}; }
function plDeleteOpsTime(pt){ const O=plOps(); plCascTime(O,pt); return {ops:O.ops,msg:null}; }        // PlanningTime.executeDeleteCommand : la part et ses attributions
function plDeleteOpsStaff(st){ const O=plOps(); plCascStaff(O,st); return {ops:O.ops,msg:null}; }     // sous-catégorie et ses heures
const plDeleteOpsStaffTime=x=>({ops:[{t:'planningstafftime',id:x.ID,val:null}],msg:null});
const plDeleteOpsAssignment=a=>({ops:[{t:'planningassignment',id:a.ID,val:null}],msg:null});
/* exécution : refus → Information ; mois → ConfirmationCheckedDialog (checked = true) ; sinon « Voulez-vous vraiment supprimer cette inscription ? » (Avertissement, Oui/Non) */
async function plDeleteRun(R,checked){ if(!R) return false; if(R.msg){ await plInfo(R.msg); return false; }
  const ok=checked?await plConfirmChecked('Confirmation','OK',PL_MSG.del+' '+PL_MSG.noUndo,PL_MSG.unused):await plAsk(PL_MSG.del,'Avertissement');
  if(!ok) return false; if(R.ops.length){ try{ await DS.commit(R.ops); }catch(e){ return false; } } return true; }   // conflit 409 / serveur : DS.commit a déjà averti
/* références depuis la planification : ouvrage (Integrity.isSubProjectDeletable : planningsubproject, planningmonth),
   phase partielle (isProjectSubPhaseDeletable : planningmonth ; + planningstaff, protection DeltaSub faute de clé étrangère), phase : ses phases partielles */
const plSubProjectUsed=id=>{ id=plId(id); return DS.by('planningsubproject','SUBPROJECT_ID',id).length>0||DS.by('planningmonth','SUBPROJECT_ID',id).length>0; };
const plSubPhaseUsed=(t,id)=>{ id=plId(id); const one=s=>DS.by('planningmonth','SUBPHASE_ID',s).length>0||DS.by('planningstaff','SUBPHASE_ID',s).length>0;
  return t==='projectphase'?DS.by('projectsubphase','PROJECTPHASE_ID',id).some(sp=>one(sp.ID)):one(id); };

/* budget temps (PlanningMonthDialog.getTimeHourPopupMenu) : q = budget / tarif ; [q, round(q) si ≠ q] | séparateur | tronqués 100/10/5, arrondis 5/10/100 (> 0, sans doublon) ; tarif ≤ 0 → [0] */
function ppTimeHourSugg(budget,rate){ const L=[], add=x=>{ if(x>0&&!L.includes(x)) L.push(x); };
  if(!(rate>0)) return {list:[0],sep:1};
  const q=budget/rate; L.push(q); const r=Math.round(q); let sep=1; if(r!==q){ L.push(r); sep=2; }
  add(Math.trunc(q/100)*100); add(Math.trunc(q/10)*10); add(Math.trunc(q/5)*5); add(Math.round(q/5)*5); add(Math.round(q/10)*10); add(Math.round(q/100)*100);
  return {list:L,sep}; }
/* montant par mois arrondi (PlanningMonthsDialog.getSetAmountPopupMenu) : [c] | ⌊c/100⌋·100, ⌊c/10⌋·10, round(c/10)·10, round(c/100)·100 */
function ppRoundSugg(c){ const L=[c], add=x=>{ if(x>0&&!L.includes(x)) L.push(x); }; add(Math.trunc(c/100)*100); add(Math.trunc(c/10)*10); add(Math.round(c/10)*10); add(Math.round(c/100)*100); return L; }
/* part du budget temps (PlanningTimeDialog) : max = 100 − Σ autres parts (seulement si 0 < Σ ≤ 100, constructeur@530-564), part replanifiée
   (si ≠ 0 et absente de la liste), séparateur si la liste n'est pas vide (getSuggestTimeRatePopupMenu@78-166), puis 0, 10, …, 100 */
function ppPartSugg(pm,role,pt){ const o=plTimes(pm).filter(x=>!pt||x.ID!==pt.ID).reduce((a,x)=>a+plN(x.TIMERATE),0), top=[], all=[];
  if(o>0&&o<=100) top.push(100-o); const s=plSuggestedRate(pm,role); if(s!=null&&s!==0&&!top.includes(s)) top.push(s); for(let i=0;i<=100;i+=10) all.push(i);
  return {top,all}; }
/* heures d'une attribution (PlanningAssignmentDialog) : non attribuées = heures de la part − autres attributions si > 0, sinon disponibilité du collaborateur ;
   puis heures des sous-catégories de la catégorie ce mois (« x h (nom) »), puis 50/25/20/10 % tronqués à l'entier */
function ppAssignSugg(pt,a,spt){ const pm=plPmOf(pt), other=plAssigns(pt).filter(x=>!a||x.ID!==a.ID).reduce((s,x)=>s+plN(x.TIMEPERIOD),0), r=plHeures(pt,pm)-other;
  const u=r>0?r:sptDisponible(spt), M=new Map();   // suggestionMap = TreeMap : un nom = une entrée (la dernière), ordre String.compareTo
  plStaffs(pt.PLANNINGROLE_ID).forEach(st=>{ const x=plStaffTimeOf(pm,st); if(x) M.set(String(st.NAME??''),plN(x.TIMEHOUR)); });
  return {u,map:[...M].sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0),pct:[50,25,20,10].map(p=>[p,Math.trunc(u*p/100)])}; }

function ppMoveCheck(sel,dir){ const R={settled:false,assigned:false,staff:false,miss:new Map()};
  for(const pm of sel){ if(plN(pm.SETTLEDAMOUNT)>0){ R.settled=true; break; }
    if(plIsAssigned(pm)){ R.assigned=true; const k=plKey(pm)+dir, [y,m]=plYM(k);
      plTimes(pm).forEach(pt=>plAssigns(pt).forEach(a=>{ const spt=DS.get('staffprojecttime',a.STAFFPROJECTTIME_ID); if(spt&&!plSptOf(spt.STAFF_ID,y,m)&&!R.miss.has(k)) R.miss.set(k,plMoisL(y,m)); })); }
    if(plStaffTimes(pm).length) R.staff=true; }
  R.missList=[...R.miss.keys()].sort((a,b)=>a-b).map(k=>R.miss.get(k)); return R; }
/* déplacement (PlanningSubPhase.moveMonths) : en avant du dernier au premier, en arrière du premier au dernier ; seulement si le mois cible est libre ;
   nouveau mois, facteur daté recopié, attributions re-liées à la disponibilité du collaborateur au nouveau mois s'il en a une ;
   bs(t, id) = versions lues avec la sélection (les confirmations laissent le temps à un autre poste de modifier ces mois → 409) */
function ppMoveOps(all,sel,dir,bs){ const occ=new Set(all.map(plKey)), ops=[], order=dir>0?sel.slice().sort(plSortPm).reverse():sel.slice().sort(plSortPm);
  for(const pm of order){ const k=plKey(pm), k2=k+dir; if(occ.has(k2)) continue; occ.delete(k); occ.add(k2); const [y,m]=plYM(k2);
    ops.push({t:'planningmonth',id:pm.ID,val:{...pm,TIMEYEAR:y,TIMEMONTH:m,INTERNALCOSTFACTOR:plFacteur(y,m)},bseq:bs?bs('planningmonth',pm.ID):undefined});
    plTimes(pm).forEach(pt=>plAssigns(pt).forEach(a=>{ const spt=DS.get('staffprojecttime',a.STAFFPROJECTTIME_ID), n=spt&&plSptOf(spt.STAFF_ID,y,m);
      if(n&&n.ID!==a.STAFFPROJECTTIME_ID) ops.push({t:'planningassignment',id:a.ID,val:{...a,STAFFPROJECTTIME_ID:n.ID}}); })); }
  return ops; }

/* ── Analyse 1 « Analyse de l'affaire » (Analyze1Dialog.setReport@0-737), R = mois de référence ── */

    if(k>R) c.pl=(c.pl??0)+plTotalInterne(pm)*(1+plN(pm.INTERNALCOSTFACTOR)/100); });   // instantané du facteur du mois planifié
  cols.forEach(c=>{ const a=c.a, past=c.k<=R, sc=past?cost.get(c.k)||0:null, sci=past?fi(c.y,c.m)*sc/100:null;

    c.v=[a[0],a[1],a[2],a[3],a[4],a[5],a[6],a[7],a[6]-a[7],sc,sci,sct,c.pl,ct,ct==null||sct==null?null:ct!==0?sct/ct*100:0,pr,a[2]!==0?pr/a[2]*100:0,past?plTauxPondere(S,c.y,c.m):null]; });

  const unit=j=>j===14||j===16||j===17?'%':cur, sg=v=>v==null?'':v>0?'#008F00':v<0?'#FF0000':'';

/* ── Analyse 3 « Analyse de l'affaire par mois » (Analyze3TableModel) : n mois consécutifs, sans Total, cumuls sur la fenêtre ── */
function paM3(F,y0,m0,n){ const p=F.p, k0=12*y0+m0, fi=paFI(), S=plSubPhaseMap(p,F.subs,F.phs), st=new Map(), cur=paCur();
  const cols=[...Array(n)].map((_,i)=>{ const [y,m]=plYM(k0+i); return {k:k0+i,y,m,empty:true,bud:0,att:0,enc:0,sc:new Map()}; }), at=k=>cols[k-k0];
  plMonths(p,F.subs,F.phs).forEach(pm=>{ const c=at(plKey(pm)); if(!c) return; c.empty=false; c.bud+=plBudget(pm); c.att+=plAttendu(pm); c.enc+=plN(pm.SETTLEDAMOUNT); });
  paTl(p,F.subs,F.phs).forEach(t=>{ const c=at(plKey(t)); if(!c) return; const s=t.STAFF_ID??null;   // coût (+) frais internes du mois, par collaborateur
    c.sc.set(s,(c.sc.get(s)||0)+tlCout(t)*(1+fi(c.y,c.m)/100)); if(!st.has(s)) st.set(s,staffName(DS.get('staff',s))); });
  let a=0,b=0,d=0,e=0; cols.forEach(c=>{ c.cost=paSum([...c.sc.values()]); c.tau=plTauxPondere(S,c.y,c.m); c.prest=S.total*c.tau/100;
    a+=c.bud; b+=c.cost; d+=c.att; e+=c.enc; c.cb=a; c.cc=b; c.ca=d; c.ce=e; });   // cumuls depuis la 1re colonne affichée (mois vides compris)
  const staff=paStaff(st), R=(t,f,o)=>paRow(t,cols.map(c=>c.empty?null:f(c)),o);   // mois sans planification : toutes les cellules vides
  const rows=[R('Budget d’honoraires',c=>c.bud,{h:1,b:1}),R('Budget d’honoraires (cumul)',c=>c.cb,{h:1}),paSP(),
    ...staff.map(([id,nm])=>R(nm,c=>c.sc.has(id)?c.sc.get(id):null)),R('Coût de revient (+) frais internes',c=>c.cost,{h:1,b:1}),R('Coût de revient (+) frais internes (cumul)',c=>c.cc,{h:1}),paSP(),
    R('Taux de réalisation',c=>c.tau,{u:'%'}),R('Prestations estimées par le directeur d’affaire',c=>c.prest),paSP(),
    R('Encaissements planifiés',c=>c.att,{h:1,b:1}),R('Encaissements planifiés (cumul)',c=>c.ca,{h:1}),paSP(),R('Encaissements',c=>c.enc,{h:1,b:1}),R('Encaissements (cumul)',c=>c.ce,{h:1}),paSP(),
    R(PA_A3_CH[2],c=>c.att-c.cost),R(PA_A3_CH[3],c=>c.ca-c.cc),R(PA_A3_CH[4],c=>c.prest-c.cb),R(PA_A3_CH[5],c=>c.ca-c.prest)];
  return {cols:[{t:'Désignation',w:330},...cols.map(c=>paCol(plMoisC(c.y,c.m))),{t:'Unité',w:48}],rows,X:{cols,staff,y0,m0}}; }
/* graphiques de l'Analyse 3 (valeurs brutes des colonnes, comme createChart1/2/3) */
function paChart3(M,t){ const X=M.X, C=X.cols, xs=C.map(c=>plMoisC(c.y,c.m)), cur=paCur(), rot=C.length>3;
  if(t===0){ const D=plStackData(C.flatMap(c=>{ const d=plMoisC(c.y,c.m); return [{x:'Budget d’honoraires '+d,parts:[['Budget d’honoraires',c.bud]]},
      {x:'Coût de revient (+) frais internes '+d,parts:X.staff.map(([id,nm])=>[nm,c.sc.get(id)||0])}]; }));
    return {mode:'Barres empilées',xs:D.xs,series:D.series,title:PA_A3_CH[0],yLabel:cur,rot,neg:1}; }   // StackedBarChart : parts négatives sous zéro
  if(t===1) return {mode:'Courbes',xs,title:PA_A3_CH[1],yLabel:cur,series:[['Budget d’honoraires (cumul)','cb'],['Encaissements planifiés (cumul)','ca'],['Encaissements (cumul)','ce'],
    ['Coût de revient (+) frais internes (cumul)','cc'],['Prestations estimées par le directeur d’affaire','prest']].map(([name,k])=>({name,vals:C.map(c=>c[k])}))};
  const f=[c=>c.att-c.cost,c=>c.ca-c.cc,c=>c.prest-c.cb,c=>c.ca-c.prest][t-2];
  return {mode:'Barres',xs,title:PA_A3_CH[t],yLabel:cur,series:[{name:PA_A3_CH[t],vals:C.map(f)}]}; }

/* ── Colonnes « phase partielle » (Analyses 4 et 6) : celles du filtre, sinon « Pas de phase partielle » puis toutes ; forme courte au-delà de 4 ── */
function paPhaseCols(F){ const L=F.phs.length?F.phs:plSubPhases(F.p), short=L.length>4;
  return L.map(ph=>({ph,t:short?'Phase partielle '+(ph?ph.NUMBER:'-'):plSubPhaseLbl(ph),cd:short?(ph?String(ph.NUMBER):'-'):plSubPhaseLbl(ph),sc:new Map()})); }
/* coût (+) frais internes par collaborateur jusqu'au mois de référence, pour une phase (getFilteredTimeLogListUntil(p, ouvrages, [phase], R)) */
function paPhaseCost(F,c,R,fi,st){ paTl(F.p,F.subs,[c.ph]).forEach(t=>{ if(plKey(t)>R) return; const s=t.STAFF_ID??null;
  c.sc.set(s,(c.sc.get(s)||0)+tlCout(t)*(1+fi(t.TIMEYEAR,t.TIMEMONTH)/100)); if(!st.has(s)) st.set(s,staffName(DS.get('staff',s))); }); }

/* ── Analyse 4 « Analyse de l'affaire par phase partielle » (Analyze4TableModel) ── */
function paM4(F,y,m){ const R=12*y+m, fi=paFI(), st=new Map();
  const cols=paPhaseCols(F).map(c=>{ const ms=plMonths(F.p,F.subs,[c.ph]), S=plSubPhaseMap(F.p,F.subs,[c.ph]);
    c.bud=paSum(ms.map(plBudget)); c.budR=paSum(ms.filter(pm=>plKey(pm)<=R).map(plBudget));
    c.tau=plTauxPondere(S,y,m); c.prest=S.total*c.tau/100;                    // taux propre de la phase (report jusqu'à son dernier mois) × budget de la phase
    paPhaseCost(F,c,R,fi,st);
    c.cost=paHashOrder([...c.sc.keys()]).reduce((a,k)=>rJ(a+c.sc.get(k)),0);   // getStaffCostTotal : Formatter.round à chaque pas, dans l'ordre de la HashMap
    return c; });
  const staff=paStaff(st), short=cols.length>4, Rw=(t,f,o)=>paRow(t,cols.map(f),o);
  const rows=[Rw('Budget d’honoraires',c=>c.bud,{h:1}),Rw('Taux de réalisation estimé par le directeur des travaux',c=>c.tau,{u:'%'}),Rw('Prestations estimées par le directeur d’affaire',c=>c.prest,{h:1,b:1}),paSP(),
    Rw('Budget d’honoraires du mois de référence',c=>c.budR,{h:1,b:1}),paSP(),...staff.map(([id,nm])=>Rw(nm,c=>c.sc.has(id)?c.sc.get(id):null)),Rw('Coût de revient (+) frais internes',c=>c.cost,{h:1,b:1})];
  return {cols:[{t:'Désignation',w:330},...cols.map(c=>paColPh(c.t)),{t:'Unité',w:48}],rows,X:{cols,staff,short,y,m}}; }
/* étiquettes à −90° seulement en forme courte (createChart : setTickLabelRotation si isShortColumnNames) */
function paChart4(M){ const X=M.X, D=plStackData(X.cols.flatMap(c=>[{x:'Budget d’honoraires '+c.cd,parts:[['Budget d’honoraires du mois de référence',c.budR]]},
    {x:'Prestations estimées '+c.cd,parts:[['Prestations estimées par le directeur d’affaire',c.prest]]},{x:'Coût de revient (+) frais internes '+c.cd,parts:X.staff.map(([id,nm])=>[nm,c.sc.get(id)||0])}]));
  return {mode:'Barres empilées',xs:D.xs,series:D.series,title:'Analyse de l’affaire par phase partielle',yLabel:paCur(),rot:X.short,neg:1}; }

/* ── Analyse 5 « Analyse de l'équipe » (Analyze5TableModel) : un seul mois ──
   écart assumé (§10.4) : coût estimé = Σ réelle des parts par catégorie (l'original ne garde que la 1re part et la compte à chaque occurrence) */
function paM5(F,y,m){ const f=plFacteur(y,m), ms=plMonths(F.p,F.subs,F.phs).filter(pm=>pm.TIMEYEAR===y&&pm.TIMEMONTH===m), bud=paSum(ms.map(plBudget)), sc=new Map(), st=new Map(), rl=new Map();
  paTl(F.p,F.subs,F.phs).forEach(t=>{ if(t.TIMEYEAR!==y||t.TIMEMONTH!==m) return; const s=t.STAFF_ID??null;
    sc.set(s,(sc.get(s)||0)+tlCout(t)*(1+f/100)); if(!st.has(s)) st.set(s,staffName(DS.get('staff',s))); });
  ms.forEach(pm=>plTimes(pm).forEach(pt=>{ const r=DS.get('planningrole',pt.PLANNINGROLE_ID), q=rl.get(pt.PLANNINGROLE_ID)||{n:r?r.NAME||'':'',v:0}; q.v+=plMontantInterne(pt,pm); rl.set(pt.PLANNINGROLE_ID,q); }));
  const staff=paStaff(st), roles=[...rl.values()].sort((a,b)=>paJcmp(a.n,b.n)), cost=paSum(staff.map(([id])=>sc.get(id))), rt=paSum(roles.map(r=>r.v)), R1=(t,v,o)=>paRow(t,[v],o);
  const rows=[R1('Budget d’honoraires',bud,{h:1,b:1}),paSP(),...staff.map(([id,nm])=>R1(nm,sc.get(id))),R1('Coût de revient (+) frais internes',cost,{h:1,b:1}),
    R1('Différence avec le budget d’honoraires',bud-cost,{h:1}),paSP(),...roles.map(r=>R1(r.n,r.v)),R1('Coût de revient estimé par catégorie d’honoraires',rt,{h:1,b:1}),
    R1('Différence avec (coût de revient + frais internes)',rt-cost,{h:1})];
  return {cols:[{t:'Désignation',w:360},paCol(plMoisC(y,m)),{t:'Unité',w:48}],rows,X:{bud,cost,rt,staff:staff.map(([id,nm])=>[nm,sc.get(id)]),roles,y,m}}; }
/* barres empilées « Analyse de l'équipe » (horizontales dans l'original : empilé vertical accepté, §8.2) */
function paChart5(M){ const X=M.X, D=plStackData([{x:'Coût de revient estimé par catégorie d’honoraires',parts:X.roles.map(r=>[r.n,r.v])},
    {x:'Coût de revient (+) frais internes',parts:X.staff},{x:'Budget d’honoraires',parts:[['Budget d’honoraires',X.bud]]}]);
  return {mode:'Barres empilées',xs:D.xs,series:D.series,title:'Analyse de l’équipe',yLabel:paCur(),neg:1}; }

/* ── Analyse 6 « Analyse de l'équipe par phase partielle » (Analyze6TableModel) : cumuls jusqu'au mois de référence ──
   écart assumé (§10.2) : dernière ligne = formule du code (estimé − réel) avec libellé corrigé ; original « Coût de revient et frais internes (-) coût de revient estimé par catégorie » */
function paM6(F,y,m){ const R=12*y+m, fi=paFI(), st=new Map(), rl=new Map(), one=F.subs.length===1&&F.phs.length===1;   // isSingletonFilter
  const cols=paPhaseCols(F).map(c=>{ const ms=plMonths(F.p,F.subs,[c.ph]).filter(pm=>plKey(pm)<=R); c.bud=paSum(ms.map(plBudget)); c.ri=new Map();
    ms.forEach(pm=>plTimes(pm).forEach(pt=>{ const id=pt.PLANNINGROLE_ID; c.ri.set(id,(c.ri.get(id)||0)+plMontantInterne(pt,pm)); if(!rl.has(id)) rl.set(id,(DS.get('planningrole',id)||{}).NAME||''); }));
    paPhaseCost(F,c,R,fi,st); c.cost=paSum([...c.sc.values()]); c.rt=paSum([...c.ri.values()]); return c; });
  const staff=paStaff(st), roles=paStaff(rl), Rw=(t,f,o)=>paRow(t,cols.map(f),o);
  const rows=[Rw('Budget d’honoraires (cumul)',c=>c.bud,{h:1,b:1}),paSP(),...staff.map(([id,nm])=>Rw(nm,c=>c.sc.has(id)?c.sc.get(id):null)),
    Rw('Coût de revient (+) frais internes (cumul)',c=>c.cost,{h:1,b:1}),Rw('Budget d’honoraires (-) coût de revient et frais internes',c=>c.bud-c.cost,{h:1}),paSP(),
    ...roles.map(([id,nm])=>Rw(nm,c=>c.ri.has(id)?c.ri.get(id):null)),Rw('Coût de revient estimé par catégorie d’honoraires',c=>c.rt,{h:1,b:1}),
    Rw('Coût de revient estimé par catégorie (-) coût de revient et frais internes',c=>c.rt-c.cost,{h:1})];
  return {cols:[{t:'Désignation',w:360},...cols.map(c=>paColPh(c.t)),{t:'Unité',w:48}],rows,X:{cols,staff,roles,one,short:cols.length>4,y,m}}; }
function paChart6(M){ const X=M.X, D=plStackData(X.cols.flatMap(c=>[{x:'Budget d’honoraires '+c.cd,parts:[['Budget d’honoraires (cumul)',c.bud]]},
    {x:'Coût de revient (+) frais internes '+c.cd,parts:X.staff.map(([id,nm])=>[nm,c.sc.get(id)||0])},
    ...(X.one?[{x:'Coût de revient (+) frais internes (cumul) '+c.cd,parts:X.roles.map(([id,nm])=>[nm,c.ri.get(id)||0])}]:[])]));   // barre des catégories : filtre singleton seulement (libellé barInternalAmount de l'original)
  return {mode:'Barres empilées',xs:D.xs,series:D.series,title:'Analyse de l’équipe par phase partielle',yLabel:paCur(),rot:X.short,neg:1}; }

/* ═══ Interface ═══ */
/* en-tête commun : « Filtre » (Ouvrage, Phase partielle) · sélecteur ◀ année ▶ / mois ▾ (12 cases, la courante cochée) · Appliquer · outils.
   ◀ ▶ et le mois ne changent que l'état : seul « Appliquer » recalcule. rows = lignes [libellé, nœud] ajoutées sous le mois (Analyse 3). */
function paHead(F,T,lbl,apply,tools,rows){ const ro=(v,w)=>h('input',{class:'inp',readonly:true,value:v,style:{width:w||'250px'}});
  const yl=h('span',{style:{minWidth:'40px',textAlign:'center'}},String(T.y)), ml=ro(MOIS_L[T.m],'110px'), upd=()=>{ yl.textContent=String(T.y); ml.value=MOIS_L[T.m]; };
  const L=t=>h('span',{style:{textAlign:'right'}},t), fl=(...x)=>h('div',{style:{display:'flex',gap:'4px',alignItems:'center'}},...x);
  const G=(t,...x)=>h('div',{style:{display:'grid',gridTemplateColumns:'max-content max-content',gap:'6px 8px',alignItems:'center'}},h('b',{style:{gridColumn:'1 / -1'}},t),...x);
  return h('div',{style:{display:'flex',gap:'28px',alignItems:'flex-start',marginBottom:'10px',flexWrap:'wrap'}},
    G('Filtre',L('Ouvrage'),ro(F.subDesc),L('Phase partielle'),ro(F.phDesc)),
    G(lbl,L('Année'),fl(ibtn({i:'prev',t:'Année précédente',fn:()=>{ T.y--; upd(); }}),yl,ibtn({i:'next',t:'Année suivante',fn:()=>{ T.y++; upd(); }})),
      L('Mois'),fl(ml,ibtn({t:'Mois',menu:()=>MOIS_L.map((t,i)=>({t,chk:i===T.m,fn:()=>{ T.m=i; upd(); }}))}),h('button',{class:'btn',style:{marginLeft:'12px'},onclick:apply},'Appliquer')),
      ...(rows||[]).flatMap(([l,x])=>[L(l),x])),
    h('div',{style:{flex:1}}),fl(...(tools||[]).map(x=>x.nodeType?x:ibtn(x)))); }   // mgGear renvoie une description de bouton
const paBox=hh=>h('div',{style:{maxHeight:hh,overflow:'auto',border:'1px solid var(--line)',background:'#fff'}});
const paChartBox=()=>h('div',{class:'mgch',style:{background:'#fff',border:'1px solid var(--line)',padding:'6px 10px',marginTop:'8px',minHeight:'120px'}});
/* dialogue modal « Fermer » (bouton par défaut) ; after = dessin des graphiques une fois la fenêtre affichée (mgChart lit la largeur) */
function paDlg(title,body,after){ const D=dialog({title,width:'min(1180px,94vw)',body:h('div',{style:{minWidth:'min(1100px,88vw)'}},body),buttons:[{t:'Fermer',pri:true}]}); plFocusPri(D);
  if(after) requestAnimationFrame(after); return D; }
const paRender=(el,g,M)=>{ mgRender(el,g,M); ctNoSort(el); };               // tableaux sans tri par en-tête (Tables.initTable(…, false))
/* CategoryAxis JavaFX : sans rotation imposée, les étiquettes sont tournées d'office quand elles ne tiennent pas dans l'espacement des catégories
   (mgChart : police 11 px ≈ 6.2 px par caractère, marges 62 px) */
const paFit=(o,el)=>{ if(!o.rot&&o.xs&&o.xs.length){ const W=Math.max(520,el.clientWidth||760), w=Math.max(...o.xs.map(x=>String(x).length))*6.2; if(w>(W-62)/o.xs.length) o.rot=true; } return o; };
/* Charts.addChartPopupMenuItem : actif si un diagramme existe ; nom de fichier « <mois long> <année> » du sélecteur (état courant, même sans « Appliquer ») */
const paSaveMenu=(el,T)=>({i:'doc',t:'Rapports',menu:()=>[{t:'Enregistrer le diagramme …',dis:!el._svg,fn:()=>mgSaveChart(el,MOIS_L[T.m]+' '+T.y)}]});

/* Analyse 1 : 3 cadres de chiffres + 3 graphiques, aucun rapport ni export */
function paOpen1(F){ const T=paPrev(), cur=paCur(), f={}, K=['bt','hs','pct','tau','prest','bud','cout','att','enc'];
  K.forEach(k=>f[k]=h('input',{class:'inp',readonly:true,style:{width:'120px',textAlign:'right'}}));
  const fr=(t,rows)=>h('div',{style:{flex:1,minWidth:'250px',border:'1px solid var(--line)',background:'#fff',padding:'8px 12px'}},h('b',{},t),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr max-content 36px',gap:'6px 8px',alignItems:'center',marginTop:'10px'}},...rows.flatMap(([l,x,u])=>[h('span',{style:{textAlign:'right'}},l),x,h('span',{},u)])));
  const ch=[0,1,2].map(()=>h('div',{style:{flex:1,minWidth:0,background:'#fff',border:'1px solid var(--line)',padding:'4px 6px'}}));
  let R=null; const draw=()=>{ if(!R) return;
    mgChart(ch[0],{mode:'Barres',xs:[''],series:[{name:'Budget temps',vals:[R.bt]},{name:'Heures saisies',vals:[R.hs]}],title:'Analyse des heures',yLabel:'h'});
    const pv=Math.min(99.996,Math.max(0.004,R.tau));                          // secteur de 100 % : un arc fermé n'est pas tracé → borné à [0.004, 99.996] (affiché 0.00 / 100.00)
    mgChart(ch[1],{mode:'Secteurs',xs:['x'],series:[{name:'Réalisé',v:pv},{name:'Non réalisé',v:100-pv}],title:'Taux de réalisation'});
    mgChart(ch[2],{mode:'Barres',xs:[''],title:'Budget, charges, encaissements (cumul)',yLabel:cur,   // un seul point par série (l'original en ajoute deux aux prestations)
      series:[['Prestations estimées','prest'],['Budget d’honoraires','bud'],['Coût de revient (+) frais internes','cout'],['Encaissements planifiés','att'],['Encaissements','enc']].map(([name,k])=>({name,vals:[R[k]]}))}); };
  const set=()=>{ R=paM1(F,T.y,T.m); K.forEach(k=>f[k].value=num(rJ(R[k]))); draw(); };
  const body=h('div',{},paHead(F,T,'Mois de référence',set),
    h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}},fr('Analyse des heures',[['Budget temps',f.bt,'h'],['Heures saisies',f.hs,'h'],['',f.pct,'%']]),
      fr('Taux de réalisation',[['Réalisé',f.tau,'%']]),fr('Budget, charges, encaissements (cumul)',[['Prestations estimées',f.prest,cur],['Budget d’honoraires',f.bud,cur],
        ['Coût de revient (+) frais internes',f.cout,cur],['Encaissements planifiés',f.att,cur],['Encaissements',f.enc,cur]])),
    h('div',{style:{display:'flex',gap:'8px',marginTop:'8px'}},...ch));
  R=paM1(F,T.y,T.m); K.forEach(k=>f[k].value=num(rJ(R[k])));               // calculé à l'ouverture (setReport dans le constructeur)
  paDlg(PA_TILES[0][0],body,draw); }

/* Analyse 2 : tableau 18 lignes + Rapports (« Afficher le rapport … ») + roue */
function paOpen2(F){ const T=paPrev(), g={}, tp=paBox('52vh'); let M=null;
  const set=()=>{ M=paM2(F,T.y,T.m); paRender(tp,g,M); };
  const rep=ibtn({i:'doc',t:'Rapports',menu:()=>[{t:'Afficher le rapport …',dis:!(M&&M.rows.length),fn:()=>paPrint2(F,M)}]});
  set(); paDlg(PA_TILES[1][0],h('div',{},paHead(F,T,'Mois de référence',set,[rep,mgGear(g,'Marge_beneficiaire')]),tp)); }

/* Analyse 3 : mois de départ + nombre de mois (JSpinner 3 … 96, défaut 12, mémorisé), tableau + 6 graphiques à bascule.
   Le bouton ▾ du nombre de mois (1, 2, 3, 6, 9, 12, 24, 36) n'est visible qu'en version de développement (setVisible(Version.isDevVersion())) : non reproduit. */
function paOpen3(F){ const T=paStart(F.p), g={}, tp=paBox('40vh'), cb=paChartBox(), sw=h('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap',marginTop:'8px'}});
  const cl=v=>Math.min(96,Math.max(3,Math.round(+v)||12)); let n=12; try{ n=cl(localStorage.getItem('ds_pa3_n')||12); }catch(_){}
  const nb=h('input',{class:'inp',type:'number',min:3,max:96,value:n,style:{width:'70px'}});
  const keep=()=>{ try{ localStorage.setItem('ds_pa3_n',String(cl(nb.value))); }catch(_){} };   // planning.Analyze3Dialog.Preferences (valeur du spinner, sans recalcul)
  nb.onchange=keep; let M=null, t=0;
  const chart=()=>{ sw.replaceChildren(...PA_A3_CH.map((l,i)=>h('button',{class:'btn'+(i===t?' pri':''),style:{height:'24px',padding:'0 10px'},onclick:()=>{ t=i; chart(); }},l))); if(M) mgChart(cb,paFit(paChart3(M,t),cb)); };
  const set=()=>{ n=cl(nb.value); nb.value=n; keep(); M=paM3(F,T.y,T.m,n); paRender(tp,g,M); chart(); };   // seul « Appliquer » recalcule
  M=paM3(F,T.y,T.m,n); paRender(tp,g,M);
  paDlg(PA_TILES[2][0],h('div',{},paHead(F,T,'Mois de départ',set,[paSaveMenu(cb,T),mgGear(g,'Analyse_par_mois')],[['Nombre de mois affiché',nb]]),tp,sw,cb),chart); }

/* Analyses 4, 5 et 6 : mois de référence (Analyse 5 : « Mois »), tableau + graphique empilé */
function paOpenT(F,i,lbl,model,chartOf,name){ const T=paPrev(), g={}, tp=paBox('40vh'), cb=paChartBox(); let M=null;
  const draw=()=>{ if(M) mgChart(cb,paFit(chartOf(M),cb)); }, set=()=>{ M=model(F,T.y,T.m); paRender(tp,g,M); draw(); };

/* ── Domaine d'affaire « Analyse de planification RH » : filtres (haut) + 6 tuiles (bas) ── */
function paDomain(C,top,pane,p){ const S=PA; if(S.pid!==p.ID){ S.pid=p.ID; S.gS={multi:true}; S.gP={multi:true}; }
  if(!plCan('projectPlanningAnalyze')){ C.append(h('div',{class:'ph'},h('h2',{},'Analyse de planification RH'),'Droit requis : « Module DELTAplanning: afficher l’analyse d’affaire ».')); return; }
  const subs=paSubRows(p), phs=plSubPhases(p), fS=h('div',{class:'pane'}), fP=h('div',{class:'pane'});
  const cS=ibtn({label:'Annuler la sélection',fn:()=>{ S.gS.selSet.clear(); draw(); }}), cP=ibtn({label:'Annuler la sélection',fn:()=>{ S.gP.selSet.clear(); draw(); }});
  const upd=()=>{ cS.disabled=!(S.gS.selSet&&S.gS.selSet.size); cP.disabled=!(S.gP.selSet&&S.gP.selSet.size); };
  /* sélection conservée au rafraîchissement, sans les lignes disparues (ouvrage ou phase supprimé sur un autre poste) */
  [[S.gS,subs],[S.gP,phs]].forEach(([g,L])=>{ if(!g.selSet) return; const ok=new Set(L.map(paKey)); [...g.selSet].forEach(k=>{ if(!ok.has(k)) g.selSet.delete(k); }); });
  const draw=()=>{ grid(fS,Object.assign(S.gS,{key:paKey,cols:[{k:'o',t:'Ouvrage',f:s=>esc(plSubProjectLbl(s))}],rows:subs,sort:null,state:{},onSel:upd})); ctNoSort(fS);
    grid(fP,Object.assign(S.gP,{key:paKey,cols:[{k:'ph',t:'Phase partielle',f:s=>esc(plSubPhaseLbl(s))}],rows:phs,sort:null,state:{},onSel:upd})); ctNoSort(fP); upd(); };
  /* un clic n'importe où sur la tuile = « Appliquer » (doClick) ; filtres lus à l'ouverture, dans l'ordre des tableaux */
  const open=i=>{ const F=paFilter(p,paSel(S.gS,subs),paSel(S.gP,phs)); [paOpen1,paOpen2,paOpen3,paOpen4,paOpen5,paOpen6][i](F); };
  const tile=([t,d],i)=>h('div',{style:{background:'#fff',border:'1px solid var(--line)',borderRadius:'6px',padding:'14px 16px',display:'flex',flexDirection:'column',gap:'8px',cursor:'pointer',minHeight:0},onclick:()=>open(i)},
    h('div',{style:{fontWeight:700,fontSize:'13px'}},t),h('div',{style:{color:'#555',flex:1}},d),h('div',{},h('button',{class:'btn'},'Appliquer')));
  const fcol=(b,el)=>h('div',{class:'col',style:{flex:1}},phead([b]),el);
  top.style.background='#f5f5f5';
  top.append(...[plBanner(),h('div',{style:{display:'flex',gap:'6px',flex:'0 0 200px',minHeight:0,padding:'6px'}},fcol(cS,fS),fcol(cP,fP)),
    h('div',{style:{flex:1,display:'grid',gridTemplateColumns:'repeat(3,minmax(0,1fr))',gridTemplateRows:'repeat(2,minmax(110px,1fr))',gap:'5px',padding:'0 6px 6px',minHeight:0,overflow:'auto'}},...PA_TILES.map(tile))].filter(Boolean));
  C.append(top); draw(); }

   MANAGEMENT ▸ PLANIFICATION RH (lot D, cahier spec_10 §5, impressions §7.1 à §7.4)
   Reproduction de management.PlanningFrame (DELTAplanning) : liste « Domaine » à gauche (dernier choix : ds_mg_planning),
   domaines 1 à 5 = PlanningAnalyzeFrame (tableau vide jusqu'au premier « Appliquer », ◀ ▶ et le mois ne recalculent pas),
   6 = PlanningProjectAssignmentFrame, 7 = PlanningStaffAssignmentFrame (calculés à l'ouverture, puis par « Appliquer »).
   Préfixes mp* / MP_* ; point d'entrée VIEWS['mg-planning'] (droit managementPlanning, à défaut management). Socle pl* (lot B0).
   Écarts assumés (§5.10, commentés sur place) : n° 1 tarif au 1er du mois planifié, n° 2 coût de revient par attribution cumulé,
   n° 3 4e mois coloré, n° 5 cumul des attributions d'un même collaborateur, n° 7 taux pondéré 0 au lieu de NaN.
═══════════════════════════════════════════════════════════════════════════ */
const MP_CATS=[['profit','Marge bénéficiaire'],['budget','Encaissements'],['assignment','Disponibilité'],['staffCost','Occupation'],
  ['staffProjectTime','Rapport mensuel collaborateur'],['projectAssignment','Attribution de l’affaire'],['staffAssignment','Attribution des collaborateurs']];   // PlanningMenuTableModel$MenuItem

const MP_GREEN='#008F00', MP_ORANGE='#FF9000', MP_RED='#FF0000';   // ReportCellRenderer$CellColor (teintes de mgColor)
/* état de session (les fenêtres de l'original sont des singletons : mois, année, filtre et dernier résultat restent jusqu'à la fermeture) */
const MP={ra:{},pa:{pf:mgPF(),pg:{},sg:{},sgPid:undefined,g:{},y:0,m:0,type:'timeHour',det:false,ap:undefined},sa:{kind:'actual',sg:{multi:true},g:{},y:0,m:0,det:false,ap:undefined}};
const mpTables=()=>[...PL_TABLES,'staffprojecttime','stafftargettime','staff','staffrate','timelog','project','projectphase','projectsubphase','subproject','setting','contact','contactowner',

const mpLoad=(k,S)=>{ try{ const o=JSON.parse(localStorage.getItem('ds_mgp_'+k)||'{}'); if(o.type) S.type=o.type; if(o.det!=null) S.det=!!o.det; }catch(_){} };   // …Frame.Preferences : type d'affichage, « Détails »
const mpKeep=(k,S)=>{ try{ localStorage.setItem('ds_mgp_'+k,JSON.stringify(k==='pa'?{type:S.type,det:S.det}:{det:S.det})); }catch(_){} };
const mpCur=()=>hfCur(null);                                                                        // Currency.getMainCurrency
const mpLim=()=>{ const v=parseFloat(hfSet('standardTableRateLimit')); return isFinite(v)?v:10; };   // Settings.getTableColoredCellRateLimit (défaut 10.0)
const mpWin=(y,m)=>[0,1,2,3].map(i=>plYM(12*y+m+i));                                               // 4 colonnes de mois à partir du mois de départ

const mpPFcrit=F=>F.st!=null||F.int!=null||!!F.grp||!!F.kind;                                        // ProjectFilter.hasCriteria

const mpSum=a=>{ const v=a.filter(x=>x!=null); return v.length?v.reduce((x,y)=>x+y,0):null; };     // colonne « Total » : somme des valeurs non nulles
/* tableau « mois » (Désignation | 12 mois | Total | Unité) ; D = [[libellé, clé, surligné, gras, unité], …] ; C = colonnes de mois */
function mpMonthTable(D,C,y,unit,desc){ const cols=[{t:desc||'Désignation',w:330},...C.map((_,m)=>({t:plMoisC(y,m),r:1,w:96})),{t:'Total',r:1,w:106},{t:'Unité',w:56}];
  return {cols,rows:D.map(([t,k,hl,b,u])=>{ const v=C.map(c=>k?c[k]:null), r={c:[t,...v,k?mpSum(v):null,k?(u||unit):null],k}; if(hl) r.lv=1; if(b) r.b=1; return r; })}; }
const mpSeries=(M,ks)=>ks.map(i=>({name:M.rows[i].c[0],vals:M.rows[i].c.slice(1,13)}));

/* ── Domaine 1 — Marge bénéficiaire (PlanningAnalyzeProfitTableModel(affaires en cours, année, mois)) ── */
const MP_PROFIT=[['Contrats et avenants','contrat',1],['Total déductions (sous-traitants, assurances, autres frais etc.)','ded'],['Frais internes','fi'],['Budget d\'honoraires','budget',1],
  ['Encaissements planifiés','attendu'],['Encaissements','encaisse'],['Solde à encaisser','solde',1],['Coût de revient','cout'],['Frais internes','coutFI'],
  ['Coût de revient (+) frais internes','coutTot',1],['Coût de revient à accomplir selon les catégories d’honoraires','planifie'],['Effort accompli+prévu','effort',1],
  ['Coût de revient total','taux',0,'%'],['Marge bénéficiaire CHF','marge',1],['Marge bénéficiaire %','margeP',0,'%'],['Taux de réalisation estimé par le directeur des travaux','tau',0,'%']];
/* colonne d'affaire ($ProjectColumn) : TOUS les mois de l'affaire, toutes années (§0.2 n° 2) ; seuls le coût réel (≤ réf.) et le planifié (> réf.) dépendent du mois de référence */
function mpProfitCol(p,y,m,fac){ const R=12*y+m, c={id:p.ID,name:p.TITLE||'',contrat:0,ded:0,fi:0,budget:0,attendu:0,encaisse:0,planifie:0,cout:0,coutFI:0};
  plMonths(p).forEach(pm=>{ c.contrat+=plContrat(pm); c.ded+=plDeductions(pm); c.fi+=plFraisInternes(pm); c.budget+=plBudget(pm); c.attendu+=plAttendu(pm); c.encaisse+=plN(pm.SETTLEDAMOUNT);
    if(plKey(pm)>R) c.planifie+=plTotalInterne(pm)*(1+plN(pm.INTERNALCOSTFACTOR)/100); });           // plannedAmountFromReferenceMonth (instantané du facteur du mois)
  c.tau=plTauxPondere(plSubPhaseMap(p),y,m,true);                                                     // τ pondéré, calculé seulement si Σ budgets > 0 (0 au lieu de NaN, §5.10 n° 7)
  DS.by('timelog','PROJECT_ID',p.ID).forEach(t=>{ if(12*t.TIMEYEAR+t.TIMEMONTH>R) return; const v=tlCout(t); c.cout+=v; c.coutFI+=v*fac(t.TIMEYEAR,t.TIMEMONTH)/100; });   // getFilteredTimeLogListUntil
  c.solde=c.attendu-c.encaisse; c.coutTot=c.cout+c.coutFI; c.effort=c.coutTot+c.planifie; c.taux=c.effort?c.coutTot/c.effort*100:0; c.marge=c.budget-c.effort; c.margeP=c.contrat?c.marge/c.contrat*100:0;
  return c; }
function mpProfitModel(projects,y,m){ const fk=new Map(), fac=(yy,mm)=>{ const k=12*yy+mm; if(!fk.has(k)) fk.set(k,plFacteur(yy,mm)); return fk.get(k); };   // facteur mis en cache par mois (HashMap de l'original)
  const P=projects.filter(p=>DS.by('planningmonth','PROJECT_ID',p.ID).length).map(p=>mpProfitCol(p,y,m,fac)), n=P.length, cur=mpCur(), lim=mpLim(), T={};
  MP_PROFIT.forEach(([,k])=>T[k]=P.reduce((a,c)=>a+c[k],0));
  T.taux=T.effort&&T.coutTot?T.coutTot/T.effort*100:0; T.margeP=T.contrat?T.marge/T.contrat*100:0; T.tau=null;   // getTotalSpentAmountRate, getTotalProfitLossRate ; τ total vide
  const col=(v,lo)=>v>lo?MP_GREEN:v>=0?MP_ORANGE:MP_RED;                                              // colorizeCell : > seuil vert, ≥ 0 orange, < 0 rouge (affaires ET Total)
  return {P,T,y,m,cols:[{t:'Désignation',w:380},...P.map(c=>({t:c.name,r:1,w:120})),{t:'Total',r:1,w:120},{t:'Unité',w:56}],
    rows:MP_PROFIT.map(([t,k,hl,u])=>{ const v=[...P.map(c=>c[k]),T[k]], r={c:[t,...v,u||cur],k}; if(hl){ r.b=1; r.lv=1; }
      if(k==='marge'||k==='margeP'){ const lo=k==='marge'?0:lim; r.cc=j=>j>=1&&j<=n+1&&v[j-1]!=null?col(v[j-1],lo):''; }
      return r; })}; }
/* impression 7.1 : tableau TRANSPOSÉ (une ligne par affaire), noms de colonnes du .dpdoc du bureau, ligne d'unités, ligne « Total » (addTotalRow, τ vide) */
function mpProfitPrint(M){ const cur=mpCur(), hd=['Désignation','Total contrats et avenants','Budget total','Effort total','Profit/Perte','Marge bénéficiaire','Degré de réalis. selon la gestion d\'affaire'];
  const rows=[{c:['Unité',cur,cur,cur,cur,'%','%'],st:'tableRow'},...M.P.map(c=>({c:[c.name,c.contrat,c.budget,c.effort,c.marge,c.margeP,c.tau],st:'tableRow'})),
    {c:['Total',M.T.contrat,M.T.budget,M.T.effort,M.T.marge,M.T.margeP,null],st:'tableTotal'}];   // Table.addTotalRow : style tableTotal

    M:{cols:hd.map((t,i)=>({t,r:i>0})),rows:rows.map(r=>({c:r.c,b:r.st!=='tableRow'}))}}; }

/* ── Domaine 2 — Encaissements (PlanningAnalyzeBudgetTableModel(affaires filtrées, année)) : 18 lignes ── */
const MP_BUDGET=[['Situations'],['Contrats et avenants','contrat',1,1],['Encaissements planifiés','sched'],['Encaissements planifiés pour sous-planificateurs','subPl'],
  ['Encaissements planifiés pour sous-traitants','subCo'],['Ajustements','amend'],['Encaissements planifiés','attendu',1,1],['Encaissements','settled',1,1],
  ['Encaissements (-) encaissements planifiés','solde',1,1],[''],['Coûts selon planification par catégorie d\'honoraires'],['Coûts selon les catégories d’honoraires','planned',1,1],
  ['Différence avec la situation','d1'],[''],['Coûts selon la planification des collaborateurs'],['Coût de revient','staff',1,1],['Différence avec la situation','d2'],
  ['Différence avec les coûts selon les catégories d\'honoraires','d3']];
function mpBudgetModel(projects,y){ const C=[...Array(12)].map(()=>({contrat:0,sched:0,subPl:0,subCo:0,amend:0,settled:0,planned:0,staff:0}));
  projects.forEach(p=>plMonths(p).forEach(pm=>{ if(pm.TIMEYEAR!==y) return; const c=C[pm.TIMEMONTH];
    c.contrat+=plContrat(pm); c.sched+=plN(pm.SCHEDULEDAMOUNT); c.subPl+=plN(pm.SUBPLANNERAMOUNT); c.subCo+=plN(pm.SUBCONTRACTORAMOUNT); c.amend+=plN(pm.AMENDEDAMOUNT); c.settled+=plN(pm.SETTLEDAMOUNT);
    c.planned+=plTotalInterne(pm);
    /* « Coût de revient » (plannedStaffAmount) — écarts assumés §5.10 n° 1 et 2 : tarif du collaborateur au 1er du mois planifié (l'original lit Calendar MONTH = année,
       donc toujours le dernier tarif) et Σ TIMEPERIOD × tarif par attribution, cumulé sur les mois (l'original multiplie par les heures de toute la catégorie et remet à 0 à chaque mois) */
    plTimes(pm).forEach(pt=>plAssigns(pt).forEach(a=>{ const spt=DS.get('staffprojecttime',a.STAFFPROJECTTIME_ID); if(spt) c.staff+=plN(a.TIMEPERIOD)*plRateMonth(spt.STAFF_ID,pm.TIMEYEAR,pm.TIMEMONTH); })); }));
  C.forEach(c=>{ c.attendu=c.sched+c.subPl+c.subCo+c.amend; c.solde=c.settled-c.attendu; c.d1=c.planned-c.attendu; c.d2=c.staff-c.attendu; c.d3=c.staff-c.planned; });   // solde : signe inverse de la Marge
  const M=mpMonthTable(MP_BUDGET,C,y,mpCur()); M.y=y;
  M.chart=()=>({xs:C.map((_,m)=>plMoisC(y,m)),series:mpSeries(M,[6,7,8,11,15]),mode:'Courbes',yLabel:mpCur(),title:'Encaissements et coût de revient'});   // LineChart, 5 séries
  return M; }
/* impression 7.2 « Paiements » : les 18 lignes (titres et vides comprises) ; lignes surlignées en tableTotal (remise à zéro de l'alternance) */
const mpBudgetPrint=M=>({type:'managementPlanningAnalyzeBudgetReport',title:'Paiements',fields:{year:String(M.y)},tables:{table:M.rows.map(r=>({c:r.c,st:r.lv?'tableTotal':'tableRow'}))},M});

/* ── Domaine 3 — Disponibilité (PlanningAnalyzeAssignmentTableModel(année)) : tous les collaborateurs, toutes les affaires ── */
const MP_ASSIGN=[['Utilisation de collaborateurs',null,1,1],['Heures disponibles des collaborateurs','tb',0,1],['Attribuées','ta'],['Non attribuées','tu',1,1],[''],
  ['Solde du temps disponible',null,1,1],['Budget horaire de l\'affaire','th',0,1],['Heures par catégorie d’honoraires','ph'],['Heures attribuées aux collaborateurs','ah'],['Heures non attribuées','uh',1,1]];
function mpAssignModel(y){ const C=[...Array(12)].map(()=>({tb:0,ta:0,th:0,ph:0,ah:0}));   // colonnes initialisées à 0 : jamais vides
  DS.all('staff').forEach(s=>dpSpt(s.ID,y).forEach(r=>{ const c=C[r.TIMEMONTH]; c.tb+=plN(r.TIMEBUDGET); c.ta+=sptAttribue(r); }));
  plMonthsByYear(y).forEach(pm=>{ const c=C[pm.TIMEMONTH]; c.th+=plN(pm.TIMEHOUR); plTimes(pm).forEach(pt=>{ c.ph+=plHeures(pt,pm); c.ah+=plAssHeures(pt); }); });   // sans filtre d'affaire ni d'état
  C.forEach(c=>{ c.tu=c.tb-c.ta; c.uh=c.ph-c.ah; });
  const M=mpMonthTable(MP_ASSIGN,C,y,'h');
  M.rows.forEach(r=>{ if(r.k==='tu'||r.k==='uh'){ const v=r.c.slice(1,14); r.cc=j=>j>=1&&j<=13&&v[j-1]!=null&&v[j-1]>10?MP_RED:''; } });   // rouge au-delà de 10.0 h (constante de l'original, §5.10 n° 4), jamais vert
  M.chart=n=>({xs:C.map((_,m)=>plMoisC(y,m)),mode:'Aires',yLabel:'h',...(n===2?{title:'Heures attribuées',series:mpSeries(M,[6,7,8,9])}:{title:'Heures disponibles des collaborateurs',series:mpSeries(M,[1,2,3])})});
  return M; }

/* ── Domaine 4 — Occupation (PlanningAnalyzeStaffCostTableModel(année)) ── */
const MP_COST=[['Heures disponibles des collaborateurs','tb',0,1,'h'],['Attribuées','ta',0,0,'h'],['Non attribuées','tu',1,1,'h'],[''],
  ['Coût de revient attribué (+) non attribué','c',0,1],['Frais internes','cf'],['Coût de revient attribué (+) non attribué (+) frais internes','ct',1,1],[''],
  ['Coût de revient attribué','ca',0,1],['Frais internes','caf'],['Coût de revient attribué (+) frais internes','cat',1,1],[''],
  ['Coût de revient non attribué','cu',0,1],['Frais internes','cuf'],['Coût de revient non attribué (+) frais internes','cut',1,1]];
function mpCostModel(y){ const C=[...Array(12)].map(()=>({tb:0,ta:0,c:0,ca:0}));
  DS.all('staff').forEach(s=>dpSpt(s.ID,y).forEach(r=>{ const c=C[r.TIMEMONTH], t=plRateMonth(s.ID,y,r.TIMEMONTH), a=sptAttribue(r);   // tarif au 1er du mois (correct dans l'original)
    c.tb+=plN(r.TIMEBUDGET); c.ta+=a; c.c+=plN(r.TIMEBUDGET)*t; c.ca+=a*t; }));
  C.forEach((c,m)=>{ const f=plFacteur(y,m); c.tu=c.tb-c.ta; c.cf=c.c*f/100; c.ct=c.c+c.cf; c.caf=c.ca*f/100; c.cat=c.ca+c.caf; c.cu=c.c-c.ca; c.cuf=c.cf-c.caf; c.cut=c.ct-c.cat; });
  const M=mpMonthTable(MP_COST,C,y,mpCur(),'Description');   // descCol de ce modèle : « Description »
  M.chart=n=>({xs:C.map((_,m)=>plMoisC(y,m)),mode:'Barres',...(n===2?{yLabel:mpCur(),title:'Coût de revient',series:mpSeries(M,[6,10,14])}:{yLabel:'h',title:'Disponibilité et charge de travail',series:mpSeries(M,[0,1,2])})});
  return M; }

/* ── Domaine 5 — Rapport mensuel collaborateur (PlanningAnalyzeStaffProjectTimeTableModel(année, mois)) ── */
function mpSptModel(y,m){ const f=plFacteur(y,m), R=[];
  DS.all('staff').forEach(s=>{ const t=plRateMonth(s.ID,y,m), spt=plSptOf(s.ID,y,m);
    if(spt){ const b=plN(spt.TIMEBUDGET), c=b*t; R.push({name:staffName(s),b,c,fi:c*f/100,a:sptAttribue(spt)}); }
    else if(s.ISACTIVE) R.push({name:staffName(s),b:0,c:0,fi:0,a:0}); });                              // actifs sans disponibilité : ligne à zéros ; anciens sans saisie : omis
  R.sort((a,b)=>cmp(a.name,b.name)); const T={name:'Total',b:0,c:0,fi:0,a:0}; R.forEach(r=>['b','c','fi','a'].forEach(k=>T[k]+=r[k]));
  const row=r=>[r.name,r.b,r.c,r.fi,r.c+r.fi,r.a,r.b-r.a,r.b?100*r.a/r.b:0], cur=mpCur();
  const M={y,m,cols:[{t:'Collaborateur',w:220},...['Disponibilité [h]','Coût de revient ['+cur+']','Frais internes ['+cur+']','Coût de revient (+) frais internes ['+cur+']',
    'Heures attribuées [h]','Heures non attribuées [h]','Attribuées aux affaires [%]'].map(t=>({t,r:1,w:150}))],rows:[...R.map(r=>({c:row(r)})),{c:row(T),b:1,lv:1}]};
  M.chart=()=>({xs:R.map(r=>r.name),series:[{name:'Heures attribuées',vals:R.map(r=>r.a)},{name:'Heures non attribuées',vals:R.map(r=>r.b-r.a)}],mode:'Barres empilées',neg:true,rot:R.length>6,yLabel:'h',title:'Occupation'});   // StackedBarChart, sans le Total
  return M; }

/* ── Domaine 6 — Attribution de l'affaire (PlanningProjectAssignmentTableModel.generateProjectReport) ──
   4 mois ; une planification (affaire × ouvrage) requise ; phases : « Pas de phase partielle » puis toutes les phases partielles ; catégories et collaborateurs par ID.
   « Non attribuées » = Σ des lignes filles − ligne mère (ReportRow.setMonthValues(total) puis subtractMonthValues(mère), signe de l'original). Aucune couleur (§5.10 n° 6). */
const MP_PA_TYPES=[['timeHour','Heures réparties par catégorie'],['internalAmount','Coût de revient']];
function mpPaModel(p,sub,y,m,type,det){ const W=mpWin(y,m), k0=12*y+m, cols=[{t:'Désignation',w:340},...W.map(([yy,mm])=>({t:plMoisC(yy,mm),r:1,w:110}))];
  const M={p,sub,y,m,cols,rows:[],flex:cols.slice(1).map(c=>c.t)}, ps=p?plSubProjectOf(p,sub):null; if(!ps) return M;
  const sid=ps.SUBPROJECT_ID??null, H=type!=='internalAmount', z=()=>[0,0,0,0], roles=DS.by('planningrole','PLANNINGSUBPROJECT_ID',ps.ID).slice().sort((a,b)=>a.ID-b.ID);
  const idx=(pm,ph)=>{ const i=plKey(pm)-k0; return (pm.SUBPROJECT_ID??null)===sid&&(pm.SUBPHASE_ID??null)===ph&&i>=0&&i<4?i:-1; };   // isPlanningMonthFilterOk + getMonthValueIndex
  plSubPhases(p).forEach((sp,n)=>{ const ph=sp?sp.ID:null, lbl=plSubPhaseLbl(sp), V=z(), T=z();
    plMonths(p).forEach(pm=>{ const i=idx(pm,ph); if(i>=0) V[i]=H?plN(pm.TIMEHOUR):plTotalInterne(pm); });
    if(n) M.rows.push({c:[]});                                                                            // ligne vide entre deux phases
    M.rows.push({c:[lbl,...V],st:'tableLevel1',b:1,lv:1});
    roles.forEach(ro=>{ const cv=z(), S=new Map();
      DS.by('planningtime','PLANNINGROLE_ID',ro.ID).forEach(pt=>{ const pm=plPmOf(pt), i=pm?idx(pm,ph):-1; if(i<0) return; cv[i]=H?plHeures(pt,pm):plMontantInterne(pt,pm);
        plAssigns(pt).forEach(a=>{ const spt=DS.get('staffprojecttime',a.STAFFPROJECTTIME_ID); if(!spt) return; let x=S.get(spt.STAFF_ID);
          if(!x) S.set(spt.STAFF_ID,x={name:staffName(DS.get('staff',spt.STAFF_ID)),v:z()});
          x.v[i]+=H?plN(a.TIMEPERIOD):plN(a.TIMEPERIOD)*plRateMonth(spt.STAFF_ID,pm.TIMEYEAR,pm.TIMEMONTH); }); });   // cumul (l'original écrase, §5.10 n° 5) ; tarif au 1er du mois (n° 1)
      M.rows.push(det?{c:[ro.NAME||'',...cv],st:'tableLevel2',b:1,lv:2}:{c:[ro.NAME||'',...cv],st:'tableRow'});
      if(det){ const t=z(); [...S.entries()].sort((a,b)=>a[0]-b[0]).forEach(([,x])=>{ M.rows.push({c:[MP_IND+x.name,...x.v],st:'tableRow'}); x.v.forEach((v,i)=>t[i]+=v); });
        M.rows.push({c:['Total '+(ro.NAME||''),...t],st:'tableLevel2Total',lv:2},{c:['Non attribuées',...t.map((v,i)=>v-cv[i])],st:'tableLevel2Total'}); }
      cv.forEach((v,i)=>T[i]+=v); });
    M.rows.push({c:['Total '+lbl,...T],st:'tableLevel1Total',lv:1},{c:['Non attribuées',...T.map((v,i)=>v-V[i])],st:'tableLevel1Total',lv:1}); });
  return M; }
/* impression 7.3 (« Attribution des collaborateurs », portrait) : FlexColumn = les 4 mois ; lignes vides omises (isEmptyRow) */
const mpPaPrint=M=>({type:'managementPlanningProjectAssignmentReport',title:'Attribution des collaborateurs',
  fields:{project:projLabel(M.p),subProjectFilterDesc:plSubProjectLbl(M.sub),year:String(M.y),month:MOIS_L[M.m]},tables:{table:M.rows.filter(r=>r.st).map(r=>({c:r.c,st:r.st})),_flex:M.flex},M});

/* ── Domaine 7 — Attribution des collaborateurs (PlanningStaffAssignmentTableModel.generateStaffReport) ──
   « Disponibilité [h] » = sptDisponible (heures prévues − 6 déductions, PAS TIMEBUDGET) ; 0.00 sans disponibilité saisie (newMonthValues = 0) ;
   affaires par ID (TITLE), phases partielles par clé (−1 = « Pas de phase partielle ») ; « Solde disponible » > 0 vert, < 0 rouge sur les 4 mois (§5.10 n° 3). */
function mpSaModel(staffs,y,m,det){ const W=mpWin(y,m), cols=[{t:'Désignation',w:340},...W.map(([yy,mm])=>({t:plMoisC(yy,mm),r:1,w:110}))], M={y,m,cols,rows:[],flex:cols.slice(1).map(c=>c.t)};
  const z=()=>[0,0,0,0], TT={b:z(),p:z(),d:z()}, cc=v=>j=>j>=1&&j<=4?(v[j-1]>0?MP_GREEN:v[j-1]<0?MP_RED:''):'';
  staffs.forEach((s,n)=>{ const B=z(), P=new Map();
    W.forEach(([yy,mm],i)=>{ const spt=plSptOf(s.ID,yy,mm); if(!spt) return; B[i]=sptDisponible(spt);
      plSptAssigns(spt).forEach(a=>{ const pr=DS.get('project',plAssProject(a)); if(!pr) return; const pm=plPmOf(DS.get('planningtime',a.PLANNINGTIME_ID)), h=plN(a.TIMEPERIOD);
        let x=P.get(pr.ID); if(!x) P.set(pr.ID,x={name:pr.TITLE||'',v:z(),ph:new Map()}); x.v[i]+=h;
        const k=pm&&pm.SUBPHASE_ID!=null?pm.SUBPHASE_ID:-1, sp=k<0?null:DS.get('projectsubphase',k);
        let q=x.ph.get(k); if(!q) x.ph.set(k,q={name:k<0?PL_NO_PHASE:plSubPhaseLbl(sp||{NUMBER:null}),v:z()}); q.v[i]+=h; }); });
    if(n) M.rows.push({c:[]});
    M.rows.push({c:[staffName(s)],st:'tableLevel1',b:1,lv:1},{c:['Disponibilité [h]',...B],st:'tableLevel1Total'});
    const Pt=z();
    [...P.entries()].sort((a,b)=>a[0]-b[0]).forEach(([,x])=>{ M.rows.push(det?{c:[x.name,...x.v],st:'tableLevel2',b:1,lv:2}:{c:[x.name,...x.v],st:'tableRow'}); x.v.forEach((v,i)=>Pt[i]+=v);
      if(det) [...x.ph.entries()].sort((a,b)=>a[0]-b[0]).forEach(([,q])=>M.rows.push({c:[MP_IND+q.name,...q.v],st:'tableRow'})); });
    const D=B.map((v,i)=>v-Pt[i]);
    M.rows.push({c:['Heures planifiées [h]',...Pt],st:'tableLevel1Total',b:1,lv:1},{c:['Solde disponible [h]',...D],st:'tableLevel1Total',lv:1,cc:cc(D)});
    B.forEach((v,i)=>{ TT.b[i]+=v; TT.p[i]+=Pt[i]; TT.d[i]+=D[i]; }); });
  if(staffs.length) M.rows.push({c:[]},{c:['Total des collaborateurs sélectionnés'],st:'tableLevel1',b:1,lv:1},{c:['Disponibilité [h]',...TT.b],st:'tableLevel1Total',lv:1,cc:cc(TT.b)},
    {c:['Heures planifiées [h]',...TT.p],st:'tableLevel1Total',lv:1,cc:cc(TT.p)},{c:['Solde disponible [h]',...TT.d],st:'tableLevel1Total',lv:1,cc:cc(TT.d)});
  return M; }
/* impression 7.4 : « Mois de départ {month} {year} » (mois long) ; lignes vides omises */
const mpSaPrint=M=>({type:'managementPlanningStaffAssignmentReport',title:'Attribution des collaborateurs',fields:{year:String(M.y),month:MOIS_L[M.m]},
  tables:{table:M.rows.filter(r=>r.st).map(r=>({c:r.c,st:r.st})),_flex:M.flex},M});
const mpPrint=d=>mgPrint(d.type,d.title,d.fields,d.tables,d.M);

/* ── Barres d'outils communes : champ mois en lecture seule + ▾ (12 cases), ◀ année ▶ — sans recalcul (seul « Appliquer » recalcule) ── */
function mpMonthBar(S){ const inp=h('input',{class:'inp',readonly:true,value:MOIS_L[S.m],style:{width:'96px'}});
  return [inp,ibtn({t:'Mois',menu:()=>MOIS_L.map((x,i)=>({t:x,chk:S.m===i,fn:()=>{ S.m=i; inp.value=x; }}))})]; }
function mpYearBar(S){ const sp=h('span',{style:{alignSelf:'center',minWidth:'44px',textAlign:'center'}},String(S.y));
  return [ibtn({i:'prev',t:'Année précédente',fn:()=>{ S.y--; sp.textContent=String(S.y); }}),sp,ibtn({i:'next',t:'Année suivante',fn:()=>{ S.y++; sp.textContent=String(S.y); }})]; }
const mpLbl=(t,o)=>h('span',{style:Object.assign({alignSelf:'center',color:'#555',margin:'0 4px 0 8px',whiteSpace:'nowrap'},o||{})},t);
const mpHead=(btns,o)=>{ const b=phead(btns); if(o&&o.wrap){ b.style.flexWrap='wrap'; b.style.rowGap='4px'; } return b; };   // barre qui passe à la ligne si la fenêtre est étroite
const mpApply=(fn,dis)=>{ const b=h('button',{class:'btn',style:{margin:'0 6px'},disabled:dis||null},'Appliquer'); b.onclick=fn; return b; };   // Strings.showResult

/* ── Domaines 1 à 5 : écran commun PlanningAnalyzeFrame (une instance par domaine) ── */
const MP_TOGGLE={assignment:['Occupation','Attribution'],staffCost:['Occupation','Coût de revient']};   // PlanningAnalyzeFrame.<type>_chart1 / _chart2
function mpAnState(type){ if(!MP.ra[type]){ const [y,m]=mpPrev(); MP.ra[type]={y,m,st:2,ap:null,ch:1,g:{}}; } return MP.ra[type]; }   // mois précédent, filtre « En cours », tableau vide
function mpAnModel(type,a){ return !a?null:type==='profit'?mpProfitModel(mpProjects(2),a.y,a.m):type==='budget'?mpBudgetModel(mpProjects(a.st),a.y)
  :type==='assignment'?mpAssignModel(a.y):type==='staffCost'?mpCostModel(a.y):mpSptModel(a.y,a.m); }
function mpAnPane(R,type){ const S=mpAnState(type), prof=type==='profit', bud=type==='budget', chart=!prof, withM=prof||type==='staffProjectTime', M=mpAnModel(type,S.ap);
  const pane=h('div',{class:'pane',style:{flex:chart?'1 1 60%':'1'}}), cb=h('div',{class:'mgch'}), ch=chart?h('div',{style:{flex:'0 0 auto',padding:'8px 12px',borderTop:'1px solid var(--line)',overflow:'auto',maxHeight:'42%'}},cb):null;
  const drawC=()=>{ cb.innerHTML=''; cb._svg=null; if(M&&M.chart) requestAnimationFrame(()=>mgChart(cb,M.chart(S.ch))); };
  const lab=mpLbl(S.st!=null?PSTATE[S.st]:'',{minWidth:'70px'});                                     // étiquette du filtre : Encaissements seulement
  const fMenu=()=>[{t:'Afficher tout',chk:S.st==null,fn:()=>{ S.st=null; lab.textContent=''; }},...Object.entries(PSTATE).map(([k,t])=>({t,chk:S.st===+k,fn:()=>{ S.st=+k; lab.textContent=t; }}))];
  const tg=(MP_TOGGLE[type]||[]).map((t,i)=>ibtn({label:t,t,on:S.ch===i+1,fn:()=>{ S.ch=i+1; tg.forEach((b,j)=>b.classList.toggle('on',j===i)); drawC(); }}));
  const rep=()=>[...(prof||bud?[{t:'Afficher le rapport …',dis:!(M&&M.rows.length),fn:()=>M&&mpPrint(prof?mpProfitPrint(M):mpBudgetPrint(M))}]:[]),   // getReportsPopupMenu
    ...(chart?[...(bud?['-']:[]),{t:'Enregistrer le diagramme …',dis:!(M&&M.chart),fn:()=>M&&mgSaveChart(cb,MOIS_L[S.m]+' '+S.y)}]:[])];   // Charts.addChartPopupMenuItem : séparateur si le menu n'est pas vide, inactif sans diagramme
  R.append(mpHead([ibtn({i:'filter',t:'Filtre',dis:!bud,menu:fMenu}),...(bud?[lab]:[]),...(prof?[mpLbl('Mois de référence')]:[]),...(withM?mpMonthBar(S):[]),...mpYearBar(S),
    mpApply(()=>{ S.ap={y:S.y,m:S.m,st:S.st}; R.innerHTML=''; mpPane(R,type); }),ibtn({i:'doc',t:'Rapports',menu:rep}),mgGear(S.g,'Planification_RH_'+type),...tg],{wrap:1}),pane);
  if(ch) R.append(ch);
  if(M){ mgRender(pane,S.g,M); drawC(); } else S.g.view=[]; }

/* ── Domaine 6 : écran PlanningProjectAssignmentFrame ── */
function mpPaPane(R){ const S=MP.pa; if(!S.y){ [S.y,S.m]=mpPrev(); mpLoad('pa',S); }
  const L=h('div',{class:'col',style:{width:'240px',flex:'0 0 auto'}}), Rt=h('div',{class:'col fill',style:{minWidth:0}}); R.append(h('div',{class:'cols',style:{flex:1,minHeight:0}},L,Rt));
  const lp=h('div',{class:'pane',style:{flex:'1 1 60%'}}), sp=h('div',{class:'pane',style:{flex:'1 1 40%',borderTop:'1px solid var(--line)'}}), pane=h('div',{class:'pane'});
  const P=()=>DS.get('project',S.pg.sel), SUB=()=>S.sg.sel&&S.sg.sel!=='x'?DS.get('subproject',S.sg.sel):null, lab=mpLbl(mpPFdesc(S.pf),{margin:'0 4px',fontSize:'12px'});
  const tl=mpLbl(''), setTl=()=>{ const p=P(), u=S.type==='internalAmount'?(p?hfCur(p):null):'h'; tl.textContent=(MP_PA_TYPES.find(t=>t[0]===S.type)||MP_PA_TYPES[0])[1]+(u?' ['+u+']':''); };
  const bA=mpApply(()=>{ const p=P(); if(!p) return; S.ap={pid:p.ID,sid:SUB()?SUB().ID:null,y:S.y,m:S.m,type:S.type,det:S.det}; drawR(); },!P());
  const drawS=()=>{ const p=P(); grid(sp,Object.assign(S.sg,{key:s=>s?String(s.ID):'x',sort:null,onSel:()=>{},
    cols:[{k:'m',t:'',w:22,f:s=>p&&plSubProjectOf(p,s)?'●':'',v:s=>p&&plSubProjectOf(p,s)?1:0},{k:'o',t:'Ouvrage',f:s=>esc(plSubProjectLbl(s)),v:s=>s?ptSub(s):''}],   // SubProjectFilterTableModel (type all)
    rows:[null,...(p?DS.by('subproject','PROJECT_ID',p.ID).slice().sort((a,b)=>cmp(a.SORTORDER,b.SORTORDER)):[])]})); };
  /* ProjectSelectionListener : ouvrages (nouveau modèle, sans sélection), étiquette du type, garde de « Appliquer » — seulement si la sélection change
     (re-clic sur l'affaire déjà choisie : aucun événement) ; f = true : liste reconstruite (filtre, « Annuler la sélection ») */
  const onP=f=>{ const id=S.pg.sel==null?null:String(S.pg.sel); if(f===true||S.sgPid!==id){ S.sgPid=id; S.sg.sel=null; } drawS(); setTl(); bA.disabled=!P(); };
  /* setProjectListTable : l'affaire choisie reste sélectionnée si la liste la contient encore ; sinon (re = après un filtre) ProjectTableModel.selectProject
     resélectionne la dernière affaire choisie (lastSelection = affaire courante d'Affaires ▸ Gestion) ; ouvrages et « Appliquer » suivent la sélection */
  const drawL=re=>{ const rows=mgPFlist(S.pf), has=id=>id!=null&&rows.some(p=>String(p.ID)===String(id));
    if(!has(S.pg.sel)){ const n=re&&has(AF.g.sel)?String(AF.g.sel):null; if(n!==S.pg.sel){ S.pg.sel=n; S.sg.sel=null; S.sgPid=n; } }
    mgProjList(lp,S.pf,S.pg,false,()=>onP()); bA.disabled=!P(); };
  const applyF=()=>{ lab.textContent=mpPFdesc(S.pf); drawL(true); onP(true); };
  const fMenu=()=>[{t:'Appliquer le filtre',chk:S.pf.on,dis:!mpPFcrit(S.pf),fn:()=>{ S.pf.on=!S.pf.on; applyF(); }},'-',{t:'Editer le filtre …',fn:()=>mgPFdialog(S.pf,applyF)},'-',
    {t:'Annuler la sélection',dis:!P(),fn:()=>{ S.pg.sel=null; drawL(); onP(true); }}];
  L.append(phead([ibtn({i:'filter',t:'Filtre',menu:fMenu}),lab]),lp,sp);
  const det=h('input',{type:'checkbox',checked:S.det||null}); det.onchange=()=>{ S.det=det.checked; mpKeep('pa',S); };   // « Détails » : mémorisé, pris en compte au prochain « Appliquer »
  let M=null; const drawR=()=>{ const a=S.ap; M=mpPaModel(a&&DS.get('project',a.pid),a?DS.get('subproject',a.sid):null,a?a.y:S.y,a?a.m:S.m,a?a.type:S.type,a?a.det:S.det); mgRender(pane,S.g,M); };
  Rt.append(mpHead([mpLbl('Mois de départ',{marginLeft:'2px'}),...mpMonthBar(S),...mpYearBar(S),
    ibtn({i:'list',t:'Type d’affichage',menu:()=>MP_PA_TYPES.map(([k,t])=>({t,chk:S.type===k,fn:()=>{ S.type=k; setTl(); mpKeep('pa',S); }}))}),tl,
    h('label',{style:{alignSelf:'center',whiteSpace:'nowrap'}},det,' Détails'),bA,
    ibtn({i:'doc',t:'Rapports',menu:()=>[{t:'Afficher le rapport …',dis:!(M&&M.rows.length),fn:()=>M&&M.rows.length&&mpPrint(mpPaPrint(M))}]}),mgGear(S.g,'Attribution_affaire')],{wrap:1}),pane);
  if(S.ap===undefined&&S.pg.sel==null&&AF.g.sel!=null) S.pg.sel=String(AF.g.sel);                        // 1re ouverture : selectProject (dernière affaire choisie)
  if(S.sgPid===undefined) S.sgPid=S.pg.sel==null?null:String(S.pg.sel);
  drawL(); drawS(); setTl();
  if(S.ap===undefined){ const p=P(); S.ap=p?{pid:p.ID,sid:null,y:S.y,m:S.m,type:S.type,det:S.det}:null; }   // initReportTable : calcul à l'ouverture (affaire resélectionnée)
  drawR(); }

/* ── Domaine 7 : écran PlanningStaffAssignmentFrame ── */
function mpSaPane(R){ const S=MP.sa; if(!S.y){ [S.y,S.m]=mpPrev(); mpLoad('sa',S); }
  const L=h('div',{class:'col',style:{width:'220px',flex:'0 0 auto'}}), Rt=h('div',{class:'col fill',style:{minWidth:0}}); R.append(h('div',{class:'cols',style:{flex:1,minHeight:0}},L,Rt));
  const lp=h('div',{class:'pane'}), pane=h('div',{class:'pane'}), lab=mpLbl('Filtré',{margin:'0 4px',fontSize:'12px',visibility:S.kind==='all'?'hidden':null});   // updateFilterDesc
  const drawL=()=>grid(lp,Object.assign(S.sg,{cols:[{k:'n',t:'Collaborateur',f:s=>esc(staffName(s)),v:s=>staffName(s)}],rows:mpStaffs(S.kind),multi:true,sort:null,onSel:()=>{},empty:'Aucun collaborateur.'}));
  const fMenu=()=>[...[['all','Tous les collaborateurs'],['actual','Collaborateurs actuels'],['former','Anciens collaborateurs']].map(([k,t])=>({t,chk:S.kind===k,
      fn:()=>{ S.kind=k; S.sg.selSet=new Set(); lab.style.visibility=k==='all'?'hidden':''; drawL(); }})),'-',
    {t:'Annuler la sélection',dis:!(S.sg.selSet&&S.sg.selSet.size),fn:()=>{ S.sg.selSet.clear(); drawL(); }}];
  L.append(phead([ibtn({i:'filter',t:'Filtre',menu:fMenu}),lab]),lp); drawL();
  const det=h('input',{type:'checkbox',checked:S.det||null}); det.onchange=()=>{ S.det=det.checked; mpKeep('sa',S); };
  const pick=()=>{ const v=S.sg.view||[], sel=v.filter(s=>S.sg.selSet&&S.sg.selSet.has(String(s.ID))); return (sel.length?sel:v).map(s=>s.ID); };   // la sélection, sinon toutes les lignes (ordre affiché)
  let M=null; const drawR=()=>{ const a=S.ap; M=mpSaModel(a.ids.map(id=>DS.get('staff',id)).filter(Boolean),a.y,a.m,a.det); mgRender(pane,S.g,M); };
  Rt.append(mpHead([mpLbl('Mois de départ',{marginLeft:'2px'}),...mpMonthBar(S),...mpYearBar(S),h('label',{style:{alignSelf:'center',whiteSpace:'nowrap',marginLeft:'8px'}},det,' Détails'),
    mpApply(()=>{ S.ap={ids:pick(),y:S.y,m:S.m,det:S.det}; drawR(); }),                                  // « Appliquer » toujours actif
    ibtn({i:'doc',t:'Rapports',menu:()=>[{t:'Afficher le rapport …',dis:!(M&&M.rows.length),fn:()=>M&&M.rows.length&&mpPrint(mpSaPrint(M))}]}),mgGear(S.g,'Attribution_collaborateurs')],{wrap:1}),pane);
  if(!S.ap) S.ap={ids:pick(),y:S.y,m:S.m,det:S.det};                                                    // initReportTable : calculé à l'ouverture (toutes les lignes)
  drawR(); }

/* ── Fenêtre « Planification RH » (management.PlanningFrame) ── */
function mpPane(R,cat){ const b=plBanner(); if(b) R.append(b);                                          // bandeau « aucune planification saisie » (amélioration DeltaSub, §1.2)
  if(cat==='projectAssignment') mpPaPane(R); else if(cat==='staffAssignment') mpSaPane(R); else mpAnPane(R,cat);
  return {tables:mpTables()}; }                                                                           // modification reçue : redessin complet, état conservé dans MP
VIEWS['mg-planning']=(()=>{ const V=mgCatView('planning',MP_CATS,mpPane,200,'Domaine'), r0=V.render;
  V.render=function(m){ if(!plCan('managementPlanning')){ m.append(h('div',{class:'empty'},'Droit requis : « Module DELTAplanning: Planification RH dans Management ».')); return; } return r0.call(this,m); };   // entrées ajoutées seulement avec le droit
  return V; })();
